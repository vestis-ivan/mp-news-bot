# =============================================================================
# Конфиг MP News Bot — только первичный посев и правила фильтрации.
# Каналы после первого запуска управляются через бота (БД в data/state.db).
# Куда слать новости — задаётся командой /here в нужном чате.
# =============================================================================

ai:
  enabled: true
  model: "gpt-4o-mini"
  summarize_if_longer_than: 400
  max_tokens: 180
  system_prompt: |
    Ты — редактор новостной ленты для селлеров маркетплейсов.
    Сделай краткое саммари поста в 2-3 предложения на русском.
    Сохрани ключевые цифры, даты, названия продуктов/функций.
    Не добавляй ничего от себя. Не используй маркдаун.

daily_digest:
  enabled: true
  send_hour_msk: 9
  ai_max_chars: 16000
  max_tokens: 3500
  max_source_links: 25
  send_without_ai: false

vc_digest:
  enabled: true
  category: mp_news
  send_hour_msk: 9
  send_minute_msk: 20
  max_age_hours: 72
  max_items: 30
  max_tokens: 2400
  pages:
    - "https://vc.ru/marketplace"
    - "https://vc.ru/new"
    - "https://vc.ru/popular"

marketing_web_digest:
  enabled: true
  category: marketing
  send_hour_msk: 9
  send_minute_msk: 40
  max_age_hours: 96
  max_items: 35
  max_tokens: 2600
  sources:
    - name: "Social Media Today"
      url: "https://www.socialmediatoday.com/feeds/news/"
    - name: "Hootsuite"
      url: "https://blog.hootsuite.com/feed/"
    - name: "Buffer"
      url: "https://buffer.com/resources/rss/"
    - name: "Sprout Social"
      url: "https://sproutsocial.com/insights/feed/"
    - name: "Social Media Examiner"
      url: "https://www.socialmediaexaminer.com/feed/"
    - name: "Glossy"
      url: "https://www.glossy.co/feed/"
    - name: "Modern Retail"
      url: "https://www.modernretail.co/feed/"
    - name: "Tubefilter"
      url: "https://www.tubefilter.com/feed/"
    - name: "Marketing Dive"
      url: "https://www.marketingdive.com/feeds/news/"

urgent_alerts:
  enabled: true
  admins_only: true
  min_text_length: 120
  keywords:
    - "штраф"
    - "блокиров"
    - "комисси"
    - "тариф"
    - "фас"
    - "маркиров"
    - "честный знак"
    - "возврат"
    - "поставка"
    - "склад"
    - "кабинет"
    - "api"
    - "интеграц"
    - "реклама"
    - "ставк"
    - "дедлайн"
    - "срок"
    - "с 1 "
    - "с 01"
    - "ozon"
    - "wildberries"
    - "wb"

catchup:
  enabled: true
  interval_seconds: 300
  limit_per_channel: 5
  max_age_hours: 36
  entity_timeout_seconds: 15
  per_channel_delay_seconds: 0.4

filter:
  ai_ad_filter:
    enabled: true
    max_chars: 2500
  block_patterns:
    - "реклам[ау]\\s*[:.]"
    - "erid\\s*[:=]"
    - "ИНН\\s*\\d{10,12}"
    - "партнёрский\\s+материал"
    - "на правах рекламы"
    - "#реклама"
    - "#промо"
  strip_lines:
    - "подпиш(ись|итесь|итесь)"
    - "^t\\.me/[a-zA-Z0-9_]+\\s*$"
    - "^@[a-zA-Z0-9_]+\\s*$"
    - "перешли\\s+друг"
    - "приглашай\\s+друзей"

